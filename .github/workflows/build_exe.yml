name: Crear Ejecutable Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install customtkinter pillow pyinstaller

      - name: Compilar EXE
        run: |
          if (Test-Path logo.png) {
            pyinstaller --noconfirm --onefile --windowed --name "Nexus3S" --add-data "logo.png;." --collect-all customtkinter app.py
          } else {
            pyinstaller --noconfirm --onefile --windowed --name "Nexus3S" --collect-all customtkinter app.py
          }

      - name: Subir ejecutable listo
        uses: actions/upload-artifact@v4
        with:
          name: Nexus3S-Windows-EXE
          path: dist/Nexus3S.exe
